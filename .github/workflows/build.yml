name: Build KČØ4P VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Clean old Android folder & regenerate
        run: |
          rm -rf android
          flutter create . --org com.kco4p --project-name kco4p_vpn --platforms=android
          flutter pub get

      # === Forcer le nom "Orange VPN" ===
      - name: Force App Name to Orange VPN
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Orange VPN"/g' android/app/src/main/AndroidManifest.xml
          if [ -f "android/app/src/main/res/values/strings.xml" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Orange VPN<\/string>/g' android/app/src/main/res/values/strings.xml
          fi
          echo " Nom de l'application forcé à : Orange VPN"
          cat android/app/src/main/AndroidManifest.xml | grep android:label

      - name: Generate custom launcher icons
        run: |
          if [ -f "assets/logo.png" ]; then
            echo "Logo trouvé → génération des icônes..."
            dart run flutter_launcher_icons
          else
            echo "assets/logo.png introuvable"
          fi

      - name: Build APK Release
        run: flutter build apk --release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: v${{ github.run_number }}
          name: Orange VPN v${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
