name: kco4p_vpn
description: KČØ4P VPN
publish_to: 'none'
version: 2.3.4+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_v2ray: ^1.0.10
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.7
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  shared_preferences: ^2.2.3
  encrypt: ^5.0.3
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
